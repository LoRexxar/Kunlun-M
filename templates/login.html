<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{ title }} | 登录</title>
  {% load static %}
  <link rel="icon" href="{% static 'favicon.ico' %}">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'font-awesome/css/font-awesome.min.css' %}">

  <style>
    :root {
      --tblr-primary: #2f5bcc;
      --tblr-primary-rgb: 47, 91, 204;
      --tblr-primary-fg: #ffffff;
    }

    body.layout-fluid {
      background: #f5f7fb;
      min-height: 100vh;
    }

    .km-auth-page {
      min-height: 100vh;
      background: radial-gradient(circle at top right,
        rgba(74, 107, 255, 0.18),
        rgba(245, 247, 251, 0.6) 60%);
    }

    .km-auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }

    .km-auth-brand {
      text-align: center;
      margin-bottom: 18px;
    }
    .km-auth-brand a {
      color: #2f5bcc;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .3px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .km-auth-card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid rgba(47, 91, 204, 0.08);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(31, 45, 61, .12);
    }
    .km-auth-card .card-body {
      padding: 32px;
    }
    .km-auth-title {
      font-size: 22px;
      font-weight: 700;
      color: #1f2a39;
      margin: 0;
    }
    .km-auth-subtitle {
      color: #64748b;
      font-size: 13px;
      margin: 4px 0 24px;
    }
    .km-auth-back-home {
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
    }
    .km-auth-back-home:hover {
      color: #2f5bcc;
    }
  </style>
</head>

<body class="layout-fluid">
<div class="page km-auth-page">
  <div class="page-wrapper">
    <main class="page-body">
      <div class="container">
        <div class="km-auth-wrap">
          <div>
            <div class="km-auth-brand">
              <a href="/">
                <i class="ti ti-shield-lock"></i>
                <span>{{ title }}</span>
              </a>
            </div>

            <div class="card card-md km-auth-card">
              <div class="card-body">
                <h1 class="km-auth-title text-center">登录到 {{ title }}</h1>
                <p class="km-auth-subtitle text-center">使用您的账户继续</p>

{% if messages %}
                <div>
{% for message in messages %}
                  <div class="alert alert-danger">{{ message }}</div>
{% endfor %}
                </div>
{% endif %}

                <form id="login" method="post" action="{% url 'index:login' %}">
                  {% csrf_token %}
                  <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <div class="input-icon">
                      <span class="input-icon-addon"><i class="fa fa-user text-muted"></i></span>
                      <input type="text" class="form-control" placeholder="请输入用户名" name="username" autofocus>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-icon">
                      <span class="input-icon-addon"><i class="fa fa-lock text-muted"></i></span>
                      <input type="password" class="form-control" placeholder="请输入密码" name="password">
                    </div>
                  </div>
                  <div class="form-footer">
                    <a id="login-btn" class="btn btn-primary w-100">
                      <i class="fa fa-sign-in me-1"></i>登录
                    </a>
                  </div>
                  <div class="hr-text">或</div>
                  <div class="text-center text-muted">
                    还没有账号？
                    <a href="{% url 'index:register' %}" class="text-primary">立即注册</a>
                  </div>
                </form>
              </div>
            </div>

            <div class="text-center mt-3">
              <a href="/" class="km-auth-back-home">
                <i class="fa fa-arrow-left me-1"></i>返回首页
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
document.getElementById("login-btn").addEventListener("click", function(e){
  e.preventDefault();
  e.stopPropagation();
  document.getElementById("login").submit();
  return false;
});
</script>

<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
</body>
</html>
